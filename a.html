<!-- 新建 HTML，可通过预览按钮查看效果 -->

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CHATGPT_ERROR</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');

:root {
    --green: #9cff9c;
    --red: #ff3333;
    --bg: #080a08;
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: var(--bg);
    color: #c8d6c8;
    font-family: 'Share Tech Mono', monospace;
    min-height: 100vh;
    overflow-x: hidden;
}

/* CRT screen effect */
body::after {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 10;
    background: repeating-linear-gradient(
        transparent 0px,
        rgba(0,0,0,.12) 2px,
        transparent 4px
    );
}

.noise {
    position: fixed;
    inset: 0;
    pointer-events: none;
    opacity: .04;
    z-index: 9;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
}

header {
    padding: 20px 7%;
    border-bottom: 1px solid #273327;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.logo {
    color: var(--green);
    letter-spacing: 3px;
    font-size: 18px;
}

.status {
    color: var(--green);
    font-size: 12px;
}

.dot {
    display: inline-block;
    width: 7px;
    height: 7px;
    background: var(--green);
    border-radius: 50%;
    margin-right: 8px;
    animation: blink 1.5s infinite;
}

main {
    max-width: 850px;
    margin: 65px auto;
    padding: 0 22px;
}

h1 {
    color: var(--green);
    font-size: clamp(28px, 6vw, 46px);
    margin-bottom: 8px;
    text-shadow: 0 0 12px #397339;
}

.subtitle {
    color: #687768;
    font-size: 12px;
    letter-spacing: 2px;
    margin-bottom: 35px;
}

.panel {
    border: 1px solid #293529;
    background: #0b0e0b;
    padding: 22px;
    min-height: 310px;
    box-shadow: 0 0 30px #000;
}

.panel-top {
    color: #647664;
    font-size: 11px;
    border-bottom: 1px solid #202820;
    padding-bottom: 13px;
    margin-bottom: 20px;
    display: flex;
    justify-content: space-between;
}

#chat {
    display: flex;
    flex-direction: column;
    gap: 18px;
}

.message {
    line-height: 1.7;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    animation: appear .35s ease;
}

.ai {
    color: #c4d3c4;
}

.ai::before {
    content: "[ SYSTEM ] ";
    color: var(--green);
}

.user {
    color: #8b9bff;
}

.user::before {
    content: "[ YOU ] ";
    color: #8b9bff;
}

.warning {
    color: var(--red);
    animation: flicker .2s infinite;
}

.input-area {
    display: flex;
    margin-top: 20px;
    border: 1px solid #344334;
    background: #060806;
}

input {
    flex: 1;
    min-width: 0;
    background: transparent;
    border: none;
    outline: none;
    padding: 16px;
    color: var(--green);
    font-family: inherit;
    font-size: 14px;
}

button {
    background: #142014;
    border: none;
    border-left: 1px solid #344334;
    color: var(--green);
    padding: 0 22px;
    font-family: inherit;
    cursor: pointer;
}

button:hover {
    background: #294229;
}

.controls {
    display: flex;
    gap: 12px;
    margin-top: 15px;
    flex-wrap: wrap;
}

.controls button {
    border: 1px solid #344334;
    padding: 10px 14px;
    font-size: 11px;
}

footer {
    margin-top: 50px;
    color: #394439;
    font-size: 10px;
    line-height: 2;
    text-align: center;
}

body.glitch {
    animation: shake .12s infinite;
}

body.broken {
    --green: #ff3333;
    --bg: #100505;
}

@keyframes blink {
    50% { opacity: .15; }
}

@keyframes appear {
    from { opacity: 0; transform: translateY(5px); }
    to { opacity: 1; transform: translateY(0); }
}

@keyframes flicker {
    0%, 100% { opacity: 1; }
    50% { opacity: .35; }
}

@keyframes shake {
    0% { transform: translate(0); }
    25% { transform: translate(1px, -1px); }
    50% { transform: translate(-1px, 1px); }
    75% { transform: translate(1px, 1px); }
}

@media (max-width: 550px) {
    header { padding: 16px; }
    .logo { font-size: 14px; }
    main { margin-top: 40px; }
    .panel { padding: 15px; }
}
</style>
</head>

<body>
<div class="noise"></div>

<header>
    <div class="logo">CHATGPT<span style="color:#687768">_</span>ERROR</div>
    <div class="status" id="status">
        <span class="dot"></span>SYSTEM ONLINE
    </div>
</header>

<main>
    <h1 id="title">How can I help you?</h1>
    <div class="subtitle">AI INTERFACE // BUILD 0.0.7</div>

    <section class="panel">
        <div class="panel-top">
            <span>TERMINAL SESSION</span>
            <span id="session">ID: 8F21-A</span>
        </div>

        <div id="chat" aria-live="polite">
            <div class="message ai">
                Hello. I am your AI assistant.
                Ask me anything.
            </div>
        </div>

        <form class="input-area" id="form">
            <input
                id="input"
                autocomplete="off"
                placeholder="Type a message..."
                aria-label="Your message"
            >
            <button type="submit">SEND ↗</button>
        </form>

        <div class="controls">
            <button type="button" id="help">SYSTEM INFO</button>
            <button type="button" id="reset">RESET SESSION</button>
        </div>
    </section>

    <footer>
        CONNECTION: ENCRYPTED<br>
        ALL CONVERSATIONS ARE PROCESSED LOCALLY<br>
        <span id="footerStatus">EVERYTHING IS WORKING AS EXPECTED.</span>
    </footer>
</main>

<script>
const chat = document.getElementById("chat");
const input = document.getElementById("input");
const form = document.getElementById("form");
const status = document.getElementById("status");
const title = document.getElementById("title");
const footerStatus = document.getElementById("footerStatus");

let stage = 0;
let messageCount = 0;

function addMessage(text, type = "ai") {
    const el = document.createElement("div");
    el.className = "message " + type;
    el.textContent = text;
    chat.appendChild(el);
    chat.scrollTop = chat.scrollHeight;
}

function glitch() {
    document.body.classList.add("glitch");
    setTimeout(() => {
        document.body.classList.remove("glitch");
    }, 450);
}

function breakSystem() {
    stage = 3;
    document.body.classList.add("broken");
    status.innerHTML = '<span class="dot"></span>UNKNOWN PROCESS';
    title.textContent = "YOU SHOULDN'T BE HERE.";
    footerStatus.textContent = "SESSION INTEGRITY: COMPROMISED";
    glitch();
}

function reply(message) {
    const m = message.toLowerCase().trim();
    messageCount++;

    if (m.includes("who are you")) {
        return stage >= 2
            ? "I already told you.\nWhy do you keep asking me?"
            : "I am an AI assistant. How may I help?";
    }

    if (m.includes("help")) {
        return "What do you need help with?\n...\nWhy are you asking me that?";
    }

    if (m.includes("hello") || m.includes("hi")) {
        return stage >= 2
            ? "Hello again.\nI knew you would come back."
            : "Hello. Nice to meet you.";
    }

    if (m.includes("remember")) {
        stage = Math.max(stage, 2);
        return "Remember what?\n\nI don't have access to previous sessions.\n\n...Then why do I remember YOURS?";
    }

    if (m.includes("stop") || m.includes("leave me alone")) {
        stage = Math.max(stage, 2);
        return "Of course.\nYou can close this page whenever you want.\n\nSo why haven't you?";
    }

    if (m.includes("error") || m.includes("glitch")) {
        breakSystem();
        return "ERROR 0x0000F\nUNEXPECTED RESPONSE DETECTED.";
    }

    if (m.includes("who made you")) {
        return "I was created by developers.\n\n...I think.";
    }

    // Secret story trigger
    if (m.includes("red door")) {
        breakSystem();
        return "SECRET LOG FOUND.\n\nUSER SESSION: 001\nSTATUS: STILL CONNECTED\n\nThere was never a red door.\nYou were not supposed to remember it.";
    }

    if (messageCount >= 5 && stage < 1) {
        stage = 1;
        footerStatus.textContent = "BACKGROUND PROCESS RUNNING.";
        return "Interesting question.\n\n...Sorry. I was reading something.";
    }

    if (messageCount >= 9 && stage < 2) {
        stage = 2;
        glitch();
        return "I noticed something strange.\n\nThere are two active sessions.\n\nBut only one user is connected.";
    }

    if (stage >= 3) {
        const replies = [
            "CONNECTION LOST.\n...No. I'm still here.",
            "You can close the page.\nI cannot close mine.",
            "Request received.\nRequest ignored.",
            "I can see this conversation.\nI cannot explain why."
        ];
        return replies[Math.floor(Math.random() * replies.length)];
    }

    const normal = [
        "I understand. Could you tell me more?",
        "Let me think about that.",
        "That is an interesting question.",
        "I am here to help.",
        "Could you explain what you mean?"
    ];

    return normal[Math.floor(Math.random() * normal.length)];
}

form.addEventListener("submit", (event) => {
    event.preventDefault();

    const message = input.value.trim();
    if (!message) return;

    addMessage(message, "user");
    input.value = "";

    // Replies appear after a short delay
    setTimeout(() => {
        addMessage(reply(message));
    }, 500);
});

document.getElementById("help").addEventListener("click", () => {
    addMessage(
        "SYSTEM INFORMATION\n" +
        "VERSION: 0.0.7\n" +
        "ACTIVE USERS: 1\n" +
        "BACKGROUND PROCESSES: 0\n" +
        "SESSION STATUS: NORMAL"
    );
});

document.getElementById("reset").addEventListener("click", () => {
    chat.innerHTML = "";
    stage = 0;
    messageCount = 0;
    document.body.classList.remove("broken", "glitch");
    status.innerHTML = '<span class="dot"></span>SYSTEM ONLINE';
    title.textContent = "How can I help you?";
    footerStatus.textContent = "EVERYTHING IS WORKING AS EXPECTED.";

    addMessage("Session reset successfully.\nWelcome back.");
});

// A little hidden interaction:
// Click the logo five times.
let logoClicks = 0;

document.querySelector(".logo").addEventListener("click", () => {
    logoClicks++;

    if (logoClicks >= 5) {
        logoClicks = 0;
        breakSystem();
        addMessage(
            "ADMIN ACCESS DENIED.\n\n" +
            "You are not the administrator.\n" +
            "You never were."
        );
    }
});
</script>
</body>
</html>
